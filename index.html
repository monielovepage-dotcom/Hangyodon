<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Little Message</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ===================== COLORS ===================== */
  :root{
    --pink:#CFEFF0;
    --pink-soft:#EAF9F9;
    --pink-line:#C4E8EA;
    --coral:#FF6F5E;
    --coral-dark:#E24E3F;
    --blue:#DCEBFA;
    --blue-line:#B3D2EE;
    --blue-ink:#2F68A8;
    --cream:#FFF7EA;
    --ink:#1F4A5A;
    --ink-soft:#5E8791;
    --white:#FFFFFF;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Mali", "Itim", system-ui, sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 1px 1px, rgba(255,255,255,.55) 1.2px, transparent 0) 0 0/18px 18px,
      linear-gradient(160deg, #D6F3F3 0%, #EFFAF6 45%, #D3E8FA 100%);
    background-attachment:fixed;
    min-height:100dvh;
    overflow-x:hidden;
    -webkit-tap-highlight-color:transparent;
  }

  /* ===================== FLOATING DECOR ===================== */
  .deco{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .deco span{
    position:absolute;bottom:-40px;
    font-size:var(--s,18px);color:var(--c,#7ED6DC);opacity:.75;
    animation:floatUp var(--d,14s) linear var(--delay,0s) infinite;
  }
  @keyframes floatUp{
    0%{transform:translate(0,0) rotate(0deg);opacity:0}
    10%{opacity:.8}
    50%{transform:translate(var(--x,20px),-55vh) rotate(160deg)}
    90%{opacity:.7}
    100%{transform:translate(0,-112vh) rotate(320deg);opacity:0}
  }

  /* ===================== LAYOUT ===================== */
  .stage{
    position:relative;z-index:1;
    min-height:100dvh;
    display:grid;place-items:center;
    padding:24px 16px;
  }
  .card{
    position:relative;
    width:100%;max-width:440px;
    background:
      radial-gradient(circle at 1px 1px, rgba(70,190,200,.16) 1px, transparent 0) 0 0/14px 14px,
      var(--white);
    border:2px solid var(--pink-line);
    border-radius:32px;
    padding:22px 20px 24px;
    box-shadow:0 18px 40px -18px rgba(30,140,160,.40), 0 4px 0 #CDEDEE;
    text-align:center;
  }
  .card::before,.card::after{ /* little corner stickers */
    position:absolute;font-size:20px;pointer-events:none;
  }
  .card::before{content:"≈";top:12px;left:18px;color:#6FD0D8}
  .card::after{content:"✦";top:14px;right:20px;color:#FF9A8B}

  .label{
    display:inline-block;
    font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
    color:#1B8C99;
    background:var(--pink-soft);
    border:1.5px dashed #8FD6DC;
    padding:5px 12px;border-radius:999px;
    margin-bottom:14px;
  }

  /* ===================== ILLUSTRATION AREA ===================== */
  .art{
    position:relative;
    width:100%;
    aspect-ratio:4/3;
    border-radius:24px;
    background:
      radial-gradient(circle at 14% 22%, rgba(255,255,255,.9) 0 5px, transparent 6px),
      radial-gradient(circle at 86% 30%, rgba(255,255,255,.8) 0 7px, transparent 8px),
      radial-gradient(circle at 78% 72%, rgba(255,255,255,.7) 0 4px, transparent 5px),
      radial-gradient(circle at 20% 78%, rgba(255,255,255,.7) 0 6px, transparent 7px),
      linear-gradient(180deg,#F2FBFB 0%, #CFEDF1 100%);
    border:2px solid var(--pink-line);
    overflow:hidden;
    display:grid;place-items:center;
  }
  .art img{
    position:absolute;inset:0;
    width:100%;height:100%;display:block;
    object-fit:contain;           /* transparent images stay crisp, no extra bg */
    background:transparent;
  }
  .art img[data-fit="cover"]{object-fit:cover}
  .art img[data-fit="contain"]{padding:4% 6% 3%;object-position:center center}
  .art img.pop{animation:imgPop .45s cubic-bezier(.34,1.56,.64,1)}
  @keyframes imgPop{0%{transform:scale(.82);opacity:.2}100%{transform:scale(1);opacity:1}}

  /* ===================== PAGES ===================== */
  .page[hidden]{display:none}
  .page.enter .msg,.page.enter .sub,.page.enter .plea-wrap,.page.enter .btns{
    animation:slideUp .6s cubic-bezier(.22,1,.36,1) both;
  }
  .page.enter .snap{animation:slideUp .6s cubic-bezier(.22,1,.36,1) .24s both}
  .page.enter .sub{animation-delay:.08s}
  .page.enter .plea-wrap{animation-delay:.1s}
  .page.enter .btns{animation-delay:.16s}
  @keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

  .msg{
    font-size:clamp(22px, 6.4vw, 28px);
    font-weight:700;line-height:1.45;
    margin:18px 4px 6px;
    color:var(--ink);
    overflow-wrap:anywhere;
    white-space:pre-line;
  }
  .sub{
    font-size:clamp(15px,4.2vw,17px);line-height:1.65;color:var(--ink-soft);
    margin:0 6px 18px;overflow-wrap:anywhere;white-space:pre-line;
  }

  /* "screenshot & send" note */
  .snap{
    display:flex;align-items:center;justify-content:center;gap:8px;
    margin:18px auto 0;max-width:100%;
    font-size:14px;line-height:1.5;font-weight:600;
    color:var(--blue-ink);
    background:#F1F8FF;
    text-align:left;width:fit-content;
    border:1.5px dashed var(--blue-line);
    padding:8px 14px;border-radius:16px;
    overflow-wrap:anywhere;white-space:pre-line;
  }
  #page3 .btns{margin-top:16px}
  .snap .cam{font-size:18px;display:inline-block;animation:bob 1.8s ease-in-out infinite}

  /* pleading line — height reserved so nothing jumps */
  .plea-wrap{min-height:52px;display:grid;place-items:center;margin:4px 0 10px}
  .plea{
    display:inline-block;
    font-size:15px;line-height:1.5;font-weight:500;
    background:var(--cream);
    border:1.5px solid #FFE0C2;
    color:#8A5A4E;
    padding:7px 14px;border-radius:18px;
    max-width:100%;
    opacity:0;transform:scale(.8);
  }
  .plea.show{animation:pleaPop .5s cubic-bezier(.34,1.56,.64,1) forwards}
  @keyframes pleaPop{0%{opacity:0;transform:scale(.7) rotate(-3deg)}100%{opacity:1;transform:scale(1) rotate(0)}}

  /* ===================== BUTTONS ===================== */
  .btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
  .btn{
    flex:1 1 140px;
    min-height:54px;
    font:inherit;font-size:17px;font-weight:600;
    border-radius:999px;
    border:2px solid transparent;
    padding:10px 18px;
    cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    transition:transform .18s ease, box-shadow .18s ease, background .18s ease;
    user-select:none;-webkit-user-select:none;
    white-space:nowrap;
  }
  .btn:focus-visible{outline:3px solid #9CC8F2;outline-offset:3px}
  .btn-primary{
    background:linear-gradient(180deg,#FF9A8A 0%, var(--coral) 100%);
    color:#fff;
    box-shadow:0 6px 0 var(--coral-dark), 0 10px 22px -8px rgba(226,78,63,.55);
    transform:scale(var(--grow,1));
  }
  .btn-primary:hover{transform:scale(var(--grow,1)) translateY(-2px)}
  .btn-primary:active{transform:scale(var(--grow,1)) translateY(4px);box-shadow:0 2px 0 var(--coral-dark)}
  .btn-primary .ico{display:inline-block;animation:bob 1.6s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-3px) rotate(-6deg)}}

  .btn-secondary{
    background:var(--blue);
    color:var(--blue-ink);
    border-color:var(--blue-line);
    box-shadow:0 5px 0 var(--blue-line);
    touch-action:none;
  }
  /* slot keeps the space when the button runs away */
  .no-slot{flex:1 1 140px;display:flex;min-height:54px}
  .no-slot .btn{flex:1}
  .btn-secondary.runaway{
    position:fixed;z-index:60;
    flex:none;
    margin:0;
    transform:scale(var(--shrink,1));
    transition:left .42s cubic-bezier(.34,1.45,.64,1), top .42s cubic-bezier(.34,1.45,.64,1), transform .3s ease;
  }
  .btn-secondary.wiggle{animation:wiggle .45s ease}
  @keyframes wiggle{
    20%{rotate:-8deg}40%{rotate:7deg}60%{rotate:-5deg}80%{rotate:3deg}
  }

  .btn-again{
    flex:0 1 auto;min-width:200px;
    background:var(--pink-soft);color:#1B8C99;
    border-color:#A8DEE2;box-shadow:0 5px 0 #A8DEE2;
  }
  .btn-again:hover{transform:translateY(-2px)}
  .btn-again:active{transform:translateY(4px);box-shadow:0 1px 0 #A8DEE2}

  .card.shake{animation:cardShake .5s ease}
  @keyframes cardShake{
    20%{transform:translateX(-5px) rotate(-.6deg)}
    40%{transform:translateX(5px) rotate(.6deg)}
    60%{transform:translateX(-3px)}
    80%{transform:translateX(2px)}
  }
  .card.fade-out{animation:fadeOut .35s ease forwards}
  @keyframes fadeOut{to{opacity:0;transform:scale(.96) translateY(6px)}}
  .card.fade-in{animation:fadeIn .5s cubic-bezier(.22,1,.36,1)}
  @keyframes fadeIn{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}

  /* ===================== ENVELOPE OVERLAY ===================== */
  .env-overlay{
    position:fixed;inset:0;z-index:80;
    display:grid;place-items:center;
    background:rgba(214,243,244,.78);
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    opacity:0;visibility:hidden;
    transition:opacity .35s ease, visibility .35s;
  }
  .env-overlay.show{opacity:1;visibility:visible}
  .envelope{
    position:relative;width:230px;height:150px;
    transform:scale(.6) translateY(30px);opacity:0;
    transition:transform .45s cubic-bezier(.34,1.56,.64,1), opacity .3s ease;
  }
  .env-overlay.show .envelope{transform:none;opacity:1}
  .env-back{position:absolute;inset:0;background:#2FB5C2;border-radius:14px}
  .env-letter{
    position:absolute;left:14px;right:14px;top:10px;height:128px;
    background:var(--cream);border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    transition:transform .7s cubic-bezier(.22,1,.36,1);
    z-index:1;
  }
  .env-letter b{font-size:30px}
  .env-letter i{display:block;height:5px;border-radius:5px;background:#CDEBEE;width:60%}
  .env-letter i:last-child{width:40%}
  .env-front{
    position:absolute;inset:0;z-index:2;border-radius:14px;
    background:#7FD6DC;
    clip-path:polygon(0 0, 50% 58%, 100% 0, 100% 100%, 0 100%);
  }
  .env-flap{
    position:absolute;left:0;right:0;top:0;height:62%;z-index:3;
    background:#55C6CF;
    clip-path:polygon(0 0,100% 0,50% 100%);
    transform-origin:top center;
    transition:transform .5s ease, z-index 0s .25s;
  }
  .env-seal{
    position:absolute;left:50%;top:44%;z-index:4;
    width:38px;height:38px;margin-left:-19px;
    border-radius:50%;background:var(--coral);color:#fff;
    display:grid;place-items:center;font-size:18px;
    box-shadow:0 3px 0 var(--coral-dark);
    transition:opacity .25s ease, transform .25s ease;
  }
  .envelope.open .env-flap{transform:rotateX(180deg);z-index:0}
  .envelope.open .env-seal{opacity:0;transform:scale(.4)}
  .envelope.rise .env-letter{transform:translateY(-78px)}

  /* ===================== CONFETTI ===================== */
  .burst{position:fixed;z-index:90;pointer-events:none;font-size:20px;line-height:1}

  /* ===================== RESPONSIVE ===================== */
  @media (max-width:380px){
    .btn{font-size:16px;padding:10px 14px;gap:6px}
  }
  @media (min-width:600px){
    .card{padding:28px 30px 30px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
    .deco{display:none}
  }
</style>
</head>
<body>

<div class="deco" id="deco" aria-hidden="true"></div>

<main class="stage">
  <article class="card" id="card">
    <span class="label" id="label"></span>

    <!-- Character image area (same size & position on both pages) -->
    <div class="art">
      <img id="charImg" alt="" decoding="async">
    </div>

    <!-- PAGE 1 -->
    <section class="page" id="page1">
      <h1 class="msg" id="msg1"></h1>
      <div class="plea-wrap" aria-live="polite"><span class="plea" id="plea"></span></div>
      <div class="btns">
        <button class="btn btn-primary" id="yesBtn" type="button">
          <span class="ico" aria-hidden="true">💌</span><span id="yesText"></span>
        </button>
        <span class="no-slot" id="noSlot">
          <button class="btn btn-secondary" id="noBtn" type="button"></button>
        </span>
      </div>
    </section>

    <!-- PAGE 2 (happy card) -->
    <section class="page" id="page2" hidden>
      <h1 class="msg" id="msg2"></h1>
      <p class="sub" id="sub2"></p>
      <div class="btns">
        <button class="btn btn-again" id="againBtn" type="button"></button>
      </div>
      <p class="snap"><span class="cam" aria-hidden="true">📸</span><span class="snap-text"></span></p>
    </section>

    <!-- PAGE 3 (after too many "no" tries) -->
    <section class="page" id="page3" hidden>
      <h1 class="msg" id="msg3"></h1>
      <div class="btns">
        <button class="btn btn-again" id="againBtn3" type="button"></button>
      </div>
      <p class="snap"><span class="cam" aria-hidden="true">📸</span><span class="snap-text"></span></p>
    </section>
  </article>
</main>

<!-- Envelope animation -->
<div class="env-overlay" id="envOverlay" aria-hidden="true">
  <div class="envelope" id="envelope">
    <div class="env-back"></div>
    <div class="env-letter"><b>💗</b><i></i><i></i></div>
    <div class="env-front"></div>
    <div class="env-flap"></div>
    <div class="env-seal">♥</div>
  </div>
</div>

<script>
/* =====================================================================
   CONFIG — แก้ข้อความ / รูป ได้ที่นี่ที่เดียว
   - src  : path ของรูป (gif / png โปร่งใส / jpg)
   - fit  : "contain" = แสดงทั้งรูป (เหมาะกับรูปพื้นโปร่งใส)
            "cover"   = เต็มกรอบ (เหมาะกับรูปที่มีฉากหลัง)
   - msgs : ข้อความอ้อนที่โชว์ตอนปุ่ม "ไม่กลับไปแล้ว" หนี (วนตามรอบ)
   ===================================================================== */

    image:   { src: IMG.hold, fit: "contain" }
  },

  // รูปเปลี่ยนไปเรื่อยๆ ทุกครั้งที่ปุ่ม "ไม่กลับไปแล้ว" หนี (วนลูป)
  dodges: [
    { src: IMG.run, fit: "contain",
      msgs: ["โอ๊ยย ใจพี่ล้มลงไปกองกับพื้นแล้ว 😵‍💫",
             "ล้มรอบสองแล้วนะ ช่วยพยุงพี่หน่อยสิ 🤕"] },
    { src: IMG.hold, fit: "contain",
      msgs: ["นะ~ นะ~ นะ~ ขอโอกาสอีกครั้งได้ไหม 🥺",
             "ขอร้องล่ะ ปุ่มสีชมพูรอหนูอยู่นะ 💗"] },
    { src: IMG.kimono, fit: "contain",
      msgs: ["มองตาพี่ดีๆ สิ มีแต่ความหวังเต็มเลย ✨",
             "ยังมีแสงสว่างอยู่นะ ถ้าหนูกดปุ่มชมพู 🌟"] },
    { src: IMG.stare, fit: "contain",
      msgs: ["ไม่มีหนู โลกพี่มืดเหลือแค่สปอตไลต์ดวงเดียว 🔦",
             "เหงาจังเลย... ยืนอยู่บนเวทีคนเดียวแล้ว 🥲"] },
    { src: IMG.run, fit: "contain",
      msgs: ["อ้าว~ ปุ่มมันหนีเองนะ ไม่เกี่ยวกับพี่เลย 🙈",
             "หนีเก่งขนาดนี้ แปลว่าฟ้าไม่ให้กดแล้วแหละ 🌸"] }
  ],

  page2: {
    label:     "YAY! A NEW BEGINNING",
    message:   "เย้~ ดีใจที่สุดเลย! 🎉",
    sub:       "ขอบคุณที่ให้โอกาสกันอีกครั้งนะ\nครั้งนี้พี่ไม่ทำให้หนูผิดหวัง 💗",
    againText: "อ่านอีกครั้ง 💗",
    image:     { src: IMG.kimono, fit: "contain" }
  },

  // หน้าที่โชว์เมื่อพยายามกด "ไม่กลับไปแล้ว" ครบ maxDodges ครั้ง
  page3: {
    label:     "A LITTLE MESSAGE FOR YOU",
    message:   "พี่เข้าใจแล้ว\nพี่เคารพการตัดสินใจของหนู",
    againText: "อ่านอีกครั้ง 💗",
    image:     { src: IMG.stare, fit: "contain" }
  },
  maxDodges: 8,

  // ใส่ \n ในข้อความเพื่อขึ้นบรรทัดใหม่
  // ข้อความชวนแคปหน้าจอ (โชว์ทั้งหน้าดีใจและหน้าเคารพการตัดสินใจ)
  snapText: "แคปหน้าจอคำตอบนี้\nส่งมาในแชทด้วยนะ",

  // ปุ่ม "ไม่กลับไปแล้ว" เล็กลงทีละนิด / ปุ่ม "เริ่มต้นใหม่" ใหญ่ขึ้นทีละนิด
  shrinkStep: 0.05, minShrink: 0.72,
  growStep:   0.03, maxGrow:   1.18
};
/* ===================================================================== */

const $ = (id) => document.getElementById(id);
const card = $("card"), img = $("charImg"), label = $("label");
const page1 = $("page1"), page2 = $("page2"), page3 = $("page3");
const pages = [page1, page2, page3];
const yesBtn = $("yesBtn"), noBtn = $("noBtn"), noSlot = $("noSlot");
const plea = $("plea"), againBtn = $("againBtn");
const envOverlay = $("envOverlay"), envelope = $("envelope");
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const sleep = (ms) => new Promise(r => setTimeout(r, reduceMotion ? Math.min(ms, 60) : ms));

/* ---------- fill text ---------- */
$("msg1").textContent = CONFIG.page1.message;
$("yesText").textContent = CONFIG.page1.yesText;
noBtn.textContent = CONFIG.page1.noText;
$("msg2").textContent = CONFIG.page2.message;
$("sub2").textContent = CONFIG.page2.sub;
againBtn.textContent = CONFIG.page2.againText;
$("msg3").textContent = CONFIG.page3.message;
$("againBtn3").textContent = CONFIG.page3.againText;
document.querySelectorAll(".snap-text").forEach(el => el.textContent = CONFIG.snapText);

/* ---------- images: preload + no broken icons ---------- */
[CONFIG.page1.image, CONFIG.page2.image, CONFIG.page3.image, ...CONFIG.dodges].forEach(o => { const i = new Image(); i.src = o.src; });
img.addEventListener("error", () => { img.style.visibility = "hidden"; });
img.addEventListener("load",  () => { img.style.visibility = "visible"; });

function setImage(o, animate = true){
  img.dataset.fit = o.fit || "contain";
  img.src = o.src;
  if (animate){ img.classList.remove("pop"); void img.offsetWidth; img.classList.add("pop"); }
}

/* ---------- floating background decor ---------- */
(function makeDeco(){
  const deco = $("deco");
  const shapes = ["○","✦","≈","☆","♡","◦","✧"];
  const colors = ["#7ED6DC","#A8E4E8","#8FC3F0","#FFB3A8","#C9E8F7","#FF9A8B"];
  const n = innerWidth < 600 ? 12 : 20;
  for (let i = 0; i < n; i++){
    const s = document.createElement("span");
    s.textContent = shapes[i % shapes.length];
    s.style.left = (Math.random() * 100) + "%";
    s.style.setProperty("--s", (12 + Math.random() * 16) + "px");
    s.style.setProperty("--c", colors[i % colors.length]);
    s.style.setProperty("--d", (12 + Math.random() * 12) + "s");
    s.style.setProperty("--delay", (-Math.random() * 20) + "s");
    s.style.setProperty("--x", ((Math.random() - .5) * 120) + "px");
    deco.appendChild(s);
  }
})();

/* ---------- confetti / hearts ---------- */
function burst(x, y, count = 22, spread = 160){
  if (reduceMotion) return;
  const items = ["💗","🫧","✨","🐙","♡","⭐","🌊"];
  for (let i = 0; i < count; i++){
    const el = document.createElement("span");
    el.className = "burst";
    el.textContent = items[i % items.length];
    el.style.left = x + "px"; el.style.top = y + "px";
    el.style.fontSize = (14 + Math.random() * 14) + "px";
    document.body.appendChild(el);
    const ang = Math.random() * Math.PI * 2;
    const dist = spread * (.4 + Math.random() * .8);
    el.animate([
      { transform: "translate(-50%,-50%) scale(.4)", opacity: 1 },
      { transform: `translate(calc(-50% + ${Math.cos(ang)*dist}px), calc(-50% + ${Math.sin(ang)*dist - 40}px)) scale(1) rotate(${(Math.random()-.5)*120}deg)`, opacity: 0 }
    ], { duration: 900 + Math.random() * 600, easing: "cubic-bezier(.22,1,.36,1)", fill: "forwards" })
      .onfinish = () => el.remove();
  }
}

/* =====================================================================
   RUNAWAY "ไม่กลับไปแล้ว" BUTTON — กดไม่ได้ หนีอย่างเดียว
   ===================================================================== */
let dodgeCount = 0, lastDodge = 0, pointer = null;

function viewport(){
  const vv = window.visualViewport;
  return vv ? { w: vv.width, h: vv.height, x: vv.offsetLeft, y: vv.offsetTop }
            : { w: innerWidth, h: innerHeight, x: 0, y: 0 };
}

function detachNo(){
  if (noBtn.classList.contains("runaway")) return;
  const r = noBtn.getBoundingClientRect();
  noSlot.style.width = r.width + "px";          // keep layout steady
  noSlot.style.height = r.height + "px";
  noBtn.style.width = r.width + "px";
  noBtn.style.left = r.left + "px";
  noBtn.style.top = r.top + "px";
  document.body.appendChild(noBtn);              // escape card transforms
  noBtn.classList.add("runaway");
  void noBtn.offsetWidth;
}

function attachNo(){
  noBtn.classList.remove("runaway", "wiggle");
  noBtn.style.cssText = "";
  noSlot.style.width = noSlot.style.height = "";
  noSlot.appendChild(noBtn);
}

function overlaps(a, b, pad = 14){
  return !(a.r + pad < b.left || a.l - pad > b.right || a.b + pad < b.top || a.t - pad > b.bottom);
}

function pickSpot(){
  const v = viewport();
  const w = noBtn.offsetWidth, h = noBtn.offsetHeight;
  const m = 12;
  const yes = yesBtn.getBoundingClientRect();
  const cur = noBtn.getBoundingClientRect();
  const from = pointer || { x: cur.left + cur.width / 2, y: cur.top + cur.height / 2 };
  let best = null, bestScore = -1;
  for (let i = 0; i < 50; i++){
    const l = v.x + m + Math.random() * Math.max(1, v.w - w - m * 2);
    const t = v.y + m + Math.random() * Math.max(1, v.h - h - m * 2);
    const box = { l, t, r: l + w, b: t + h };
    if (overlaps(box, yes)) continue;
    const cx = l + w / 2, cy = t + h / 2;
    const dPointer = Math.hypot(cx - from.x, cy - from.y);
    const dCur = Math.hypot(l - cur.left, t - cur.top);
    if (dCur < 70) continue;
    const score = Math.min(dPointer, 320) + Math.random() * 60;
    if (score > bestScore){ bestScore = score; best = { l, t }; }
  }
  return best || { l: v.x + m, t: v.y + m };
}

function dodge(){
  const now = performance.now();
  if (now - lastDodge < 280 || page1.hidden || busy) return;   // de-dupe touch + click
  lastDodge = now;

  // ครบจำนวนครั้ง → ไปหน้า "พี่เข้าใจแล้ว"
  if (dodgeCount + 1 >= CONFIG.maxDodges){ dodgeCount++; goToPage3(); return; }

  detachNo();
  const old = noBtn.getBoundingClientRect();
  burst(old.left + old.width / 2, old.top + old.height / 2, 6, 60);

  // shrink "no", grow "yes"
  dodgeCount++;
  noBtn.style.setProperty("--shrink", Math.max(CONFIG.minShrink, 1 - dodgeCount * CONFIG.shrinkStep));
  yesBtn.style.setProperty("--grow", Math.min(CONFIG.maxGrow, 1 + dodgeCount * CONFIG.growStep));

  const spot = pickSpot();
  noBtn.style.left = spot.l + "px";
  noBtn.style.top = spot.t + "px";
  noBtn.classList.remove("wiggle"); void noBtn.offsetWidth; noBtn.classList.add("wiggle");

  // change character + pleading message
  const idx = (dodgeCount - 1) % CONFIG.dodges.length;
  const round = Math.floor((dodgeCount - 1) / CONFIG.dodges.length);
  const item = CONFIG.dodges[idx];
  setImage(item);
  plea.textContent = item.msgs[round % item.msgs.length];
  plea.classList.remove("show"); void plea.offsetWidth; plea.classList.add("show");

  card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
}

// Desktop: run when the mouse gets close
document.addEventListener("pointermove", (e) => {
  pointer = { x: e.clientX, y: e.clientY };
  if (e.pointerType !== "mouse" || page1.hidden) return;
  const r = noBtn.getBoundingClientRect();
  const nx = Math.max(r.left, Math.min(e.clientX, r.right));
  const ny = Math.max(r.top,  Math.min(e.clientY, r.bottom));
  if (Math.hypot(e.clientX - nx, e.clientY - ny) < 28) dodge();
});
noBtn.addEventListener("pointerenter", (e) => { pointer = { x: e.clientX, y: e.clientY }; dodge(); });
// Mobile: tap → run (never registers as a click)
noBtn.addEventListener("pointerdown", (e) => { e.preventDefault(); pointer = { x: e.clientX, y: e.clientY }; dodge(); });
noBtn.addEventListener("touchstart", (e) => { e.preventDefault(); dodge(); }, { passive: false });
// Keyboard / anything else: click does nothing but run
noBtn.addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); pointer = null; dodge(); });

// keep the runaway button on screen after resize / rotation
addEventListener("resize", () => {
  if (!noBtn.classList.contains("runaway")) return;
  const v = viewport(), r = noBtn.getBoundingClientRect();
  noBtn.style.left = Math.min(Math.max(v.x + 12, r.left), v.x + v.w - r.width - 12) + "px";
  noBtn.style.top  = Math.min(Math.max(v.y + 12, r.top),  v.y + v.h - r.height - 12) + "px";
});

/* =====================================================================
   PAGE SWITCHING
   ===================================================================== */
let busy = false;

function showPage(n){
  pages.forEach((pg, i) => { if (i !== n - 1){ pg.hidden = true; pg.classList.remove("enter"); } });
  const p = pages[n - 1];
  p.hidden = false;
  p.classList.remove("enter"); void p.offsetWidth; p.classList.add("enter");
  label.textContent = CONFIG["page" + n].label;
}

async function goToPage3(){
  if (busy) return; busy = true;
  attachNo();
  card.classList.remove("fade-in", "shake"); card.classList.add("fade-out");
  await sleep(400);
  card.classList.remove("fade-out");
  plea.textContent = ""; plea.classList.remove("show");
  setImage(CONFIG.page3.image, false);
  showPage(3);
  card.classList.add("fade-in");
  busy = false;
}

function resetPage1(){
  dodgeCount = 0;
  attachNo();
  yesBtn.style.removeProperty("--grow");
  plea.textContent = ""; plea.classList.remove("show");
  setImage(CONFIG.page1.image, false);
}

yesBtn.addEventListener("click", async () => {
  if (busy) return; busy = true;
  attachNo();                                  // bring runaway button home
  envOverlay.classList.add("show");
  await sleep(500);
  envelope.classList.add("open");
  await sleep(450);
  envelope.classList.add("rise");
  await sleep(750);
  setImage(CONFIG.page2.image, false);
  showPage(2);
  card.classList.remove("fade-in"); void card.offsetWidth; card.classList.add("fade-in");
  envOverlay.classList.remove("show");
  await sleep(200);
  const r = card.getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height * .35, 30, 220);
  envelope.classList.remove("open", "rise");
  busy = false;
});

async function readAgain(){
  if (busy) return; busy = true;
  card.classList.remove("fade-in"); card.classList.add("fade-out");
  await sleep(350);
  card.classList.remove("fade-out");
  resetPage1();
  showPage(1);
  card.classList.add("fade-in");
  busy = false;
}
againBtn.addEventListener("click", readAgain);
$("againBtn3").addEventListener("click", readAgain);

/* ---------- start ---------- */
setImage(CONFIG.page1.image, false);
showPage(1);
</script>
